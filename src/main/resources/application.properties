spring.application.name=aulalink
server.port=8080

logging.pattern.dateformat=HH:mm:ss
spring.main.banner-mode=off
spring.thymeleaf.cache=false

# Base local. Ejecutar antes src/main/resources/creaTablas.sql como administrador de MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/aulalink
spring.datasource.username=usuario_prueba
spring.datasource.password=Usuar1o_Clave.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
