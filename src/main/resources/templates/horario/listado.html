<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/barra :: barra(${usuario})}"></header>
        <main class="container py-4">
            <h1 class="h3 mb-3">[[#{horario.listado}]]</h1>
            <div class="row g-3">
                <div class="col-lg-8">
                    <section class="tarjeta-acceso">
                        <h2 class="h5">[[#{horario.agregar}]]</h2>
                        <form class="row g-3 align-items-end" method="post" th:action="@{/horario/guardar}">
                            <div class="col-md-5">
                                <label for="fecha">[[#{horario.fecha}]]</label>
                                <input id="fecha" class="form-control" type="date" name="fecha" required="required"/>
                            </div>
                            <div class="col-md-4">
                                <label for="hora">[[#{horario.hora}]]</label>
                                <input id="hora" class="form-control" type="time" name="hora" required="required"/>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-acceso w-100" type="submit">[[#{accion.guardar}]]</button>
                            </div>
                        </form>
                    </section>
                    <section class="tarjeta-acceso mt-3">
                        <p th:if="${horarios == null or horarios.empty}" class="mb-0">[[#{horario.vacio}]]</p>
                        <div class="table-responsive" th:if="${horarios != null and !horarios.empty}">
                            <table class="table align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>[[#{horario.fecha}]]</th>
                                        <th>[[#{horario.hora}]]</th>
                                        <th>[[#{estudiante.estado}]]</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="horario : ${horarios}">
                                        <td th:text="${horario.fecha}"></td>
                                        <td th:text="${horario.hora}"></td>
                                        <td>
                                            <span th:if="${horario.disponible}" class="badge text-bg-success">[[#{horario.disponible}]]</span>
                                            <span th:unless="${horario.disponible}" class="badge text-bg-secondary">[[#{horario.ocupado}]]</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
                <div class="col-lg-4">
                    <section class="tarjeta-acceso text-center">
                        <h2 class="h6">[[#{horario.total}]]</h2>
                        <p class="display-6 mb-0" th:text="${totalHorarios}">0</p>
                    </section>
                </div>
            </div>
        </main>
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>
    </body>
</html>
