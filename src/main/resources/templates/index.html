<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>AulaLink</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
        <link th:href="@{/css/estilos.css}" rel="stylesheet"/>
    </head>
    <body>
        <header class="barra-superior border-bottom">
            <div class="container py-3 d-flex align-items-center gap-2">
                <span class="logo-marca">Logo</span>
                <span class="fw-bold fs-5">AulaLink</span>
            </div>
        </header>

        <section class="banner-bienvenida">
            <div class="container py-4 py-md-5">
                <h1 class="mb-2">[[#{index.bienvenida}]]</h1>
                <p>[[#{index.subtitulo}]]</p>
            </div>
        </section>

        <main class="container py-4">
            <div class="row g-4 align-items-start">
                <div class="col-lg-6" id="iniciar-sesion">
                    <section class="tarjeta-acceso">
                        <h2>[[#{acceso.login.titulo}]]</h2>
                        <div th:if="${errorLogin}" class="alert alert-danger py-2" role="alert">[[${errorLogin}]]</div>
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="correoLogin">[[#{acceso.correo}]]</label>
                                <input id="correoLogin" class="form-control" type="email" name="correo"
                                       th:placeholder="#{acceso.placeholder.correo}"
                                       th:value="${correoLogin}" required="required"/>
                            </div>
                            <div class="mb-3">
                                <label for="contrasenaLogin">[[#{acceso.contrasena}]]</label>
                                <input id="contrasenaLogin" class="form-control" type="password" name="contrasena" required="required"/>
                            </div>
                            <button class="btn btn-acceso" type="submit">[[#{acceso.login.boton}]]</button>
                        </form>
                        <p class="nota-acceso mt-3 mb-2">[[#{acceso.login.inactivo}]]</p>
                        <a class="enlace-acceso d-block" href="#iniciar-sesion">[[#{acceso.tutor}]]</a>
                        <a class="enlace-acceso d-block mt-1" href="#iniciar-sesion">[[#{acceso.admin}]]</a>
                    </section>
                </div>

                <div class="col-lg-6" id="registro">
                    <section class="tarjeta-acceso">
                        <h2>[[#{acceso.registro.titulo}]]</h2>
                        <div th:if="${registroOk}" class="alert alert-success py-2" role="status">[[${registroOk}]]</div>
                        <div th:if="${errorRegistro}" class="alert alert-danger py-2" role="alert">[[${errorRegistro}]]</div>
                        <form th:action="@{/registro}" method="post">
                            <div class="mb-3">
                                <label for="nombreCompleto">[[#{acceso.nombre}]]</label>
                                <input id="nombreCompleto" class="form-control" type="text" name="nombreCompleto"
                                       th:placeholder="#{acceso.placeholder.nombre}"
                                       th:value="${nombreCompleto}" required="required"/>
                            </div>
                            <div class="mb-3">
                                <label for="correoRegistro">[[#{acceso.correo}]]</label>
                                <input id="correoRegistro" class="form-control" type="email" name="correo"
                                       th:placeholder="#{acceso.placeholder.correo}"
                                       th:value="${correoRegistro}" required="required"/>
                            </div>
                            <div class="mb-3">
                                <label for="contrasenaRegistro">[[#{acceso.contrasena}]]</label>
                                <input id="contrasenaRegistro" class="form-control" type="password" name="contrasena"
                                       minlength="8" th:placeholder="#{acceso.placeholder.contrasena}" required="required"/>
                            </div>
                            <button class="btn btn-acceso" type="submit">[[#{acceso.registro.boton}]]</button>
                        </form>
                    </section>
                </div>
            </div>
        </main>
    </body>
</html>
